apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics-k8s-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: services
  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-metrics-k8s-stack
    targetRevision: 0.72.5
    helm:
      values: |
        argocdReleaseOverride: victoria-metrics-k8s-stack
        victoria-metrics-operator:
          enabled: true
          crds:
            plain: true
        vmsingle:
          enabled: true
          spec:
            # Lightweight homelab: short retention + capped cache/memory
            retentionPeriod: "7d"
            extraArgs:
              memory.allowedPercent: "40"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                # 384Mi OOMed during WAL replay; 512Mi gives startup headroom
                memory: 512Mi
            storage:
              resources:
                requests:
                  storage: 8Gi
        vmagent:
          spec:
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 160Mi
        # Alerting stack disabled: no alertmanager receivers configured, so
        # vmalert + alertmanager + default rules were pure overhead on a homelab.
        alertmanager:
          enabled: false
        vmalert:
          enabled: false
        defaultRules:
          create: false
        grafana:
          enabled: true
          adminPassword: admin
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 224Mi
          sidecar:
            datasources:
              enabled: true
              label: grafana_datasource
              labelValue: "1"
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
        defaultDashboards:
          enabled: true
        kubelet:
          enabled: true
          spec:
            metricRelabelConfigs:
              - action: labeldrop
                regex: (uid)
              - action: labeldrop
                regex: (id|name)
              - action: drop
                source_labels: [__name__]
                regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
        kubeApiServer:
          enabled: true
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
  ignoreDifferences:
    - group: ""
      kind: "*"
      jsonPointers:
        - /metadata/finalizers
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
