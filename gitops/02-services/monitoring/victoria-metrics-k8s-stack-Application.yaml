apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics-k8s-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: services
  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-metrics-k8s-stack
    targetRevision: 0.72.5
    helm:
      values: |
        argocdReleaseOverride: victoria-metrics-k8s-stack
        victoria-metrics-operator:
          enabled: true
          crds:
            plain: true
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
        vmsingle:
          enabled: true
          spec:
            # Lightweight homelab: short retention + capped cache/memory
            retentionPeriod: "7d"
            extraArgs:
              memory.allowedPercent: "40"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                # 384Mi OOMed during WAL replay; 512Mi gives startup headroom
                memory: 512Mi
            storage:
              resources:
                requests:
                  storage: 8Gi
        vmagent:
          spec:
            resources:
              requests:
                cpu: 25m
                memory: 96Mi
              limits:
                # 160Mi ran at ~95% steady; 256Mi gives scrape-burst headroom
                memory: 256Mi
        # Alerting stack disabled: no alertmanager receivers configured, so
        # vmalert + alertmanager + default rules were pure overhead on a homelab.
        alertmanager:
          enabled: false
        vmalert:
          enabled: false
        defaultRules:
          create: false
        grafana:
          enabled: true
          adminPassword: admin
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 224Mi
          sidecar:
            # All dashboards/datasources live in the monitoring namespace; scope
            # the (python) sidecars there instead of watching all namespaces, and
            # cap them — uncapped they ran ~75-80Mi each. `resources` is a single
            # shared block applied to every sidecar container in this chart.
            resources:
              requests:
                cpu: 10m
                memory: 48Mi
              limits:
                memory: 128Mi
            datasources:
              enabled: true
              label: grafana_datasource
              labelValue: "1"
              searchNamespace: monitoring
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: monitoring
        defaultDashboards:
          enabled: true
        kube-state-metrics:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 64Mi
        kubelet:
          enabled: true
          spec:
            metricRelabelConfigs:
              - action: labeldrop
                regex: (uid)
              - action: labeldrop
                regex: (id|name)
              - action: drop
                source_labels: [__name__]
                regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
        kubeApiServer:
          enabled: true
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
  ignoreDifferences:
    - group: ""
      kind: "*"
      jsonPointers:
        - /metadata/finalizers
    # The operator self-injects its webhook CA; don't let selfHeal revert it
    # (would break admission until the operator re-injects).
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
    - group: ""
      kind: Secret
      name: victoria-metrics-k8s-stack-victoria-metrics-operator-validation
      jsonPointers:
        - /data
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
