apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private
  namespace: istio-system
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  addresses:
    # Pin the ClusterIP so it matches the Tailscale Connector advertised route
    # (private-gateway-Connector.yaml) and the *.mmonteiro.dev wildcard DNS.
    - type: IPAddress
      value: 10.43.117.2
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-mmonteiro-dev-tls
      allowedRoutes:
        namespaces:
          from: All
