apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private
  namespace: istio-system
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  # NOTE: Istio 1.28 does not honor spec.addresses to pin the ClusterIP of the
  # generated Service, so the ClusterIP is dynamic. The Tailscale Connector
  # (private-gateway-Connector.yaml) advertises the actual assigned ClusterIP,
  # which must also match the *.mmonteiro.dev wildcard DNS record in Cloudflare.
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-mmonteiro-dev-tls
      allowedRoutes:
        namespaces:
          from: All
