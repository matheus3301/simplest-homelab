apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private
  namespace: istio-system
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  # Pin the ClusterIP so it matches the wildcard DNS (*.mmonteiro.dev) and the
  # Tailscale connector's advertised route. Without this, k3s assigns a random
  # ClusterIP from the service CIDR and private services become unreachable.
  addresses:
    - type: IPAddress
      value: 10.43.241.105
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-mmonteiro-dev-tls
      allowedRoutes:
        namespaces:
          from: All
