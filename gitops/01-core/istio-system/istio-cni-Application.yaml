apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: cni
    targetRevision: 1.28.1
    helm:
      values: |
        profile: ambient
        # k3s stores CNI config/binaries outside the default /etc/cni/net.d
        # and /opt/cni/bin; this profile points istio-cni at the k3s paths
        # so it can chain onto flannel.
        platform: k3s
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
