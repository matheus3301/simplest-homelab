apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: private-gateway
  namespace: tailscale
spec:
  proxyClass: metrics-enabled
  hostname: private-gateway
  subnetRouter:
    advertiseRoutes:
      # Must match the private-istio gateway ClusterIP and the *.mmonteiro.dev
      # wildcard DNS record in Cloudflare. Istio assigns this ClusterIP
      # dynamically (spec.addresses pinning is a no-op on Istio 1.28); if the
      # private-istio Service is ever recreated, update this + the DNS record.
      - "10.43.45.223/32"
  tags:
    - "tag:k8s"
