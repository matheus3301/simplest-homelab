apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: private-gateway
  namespace: tailscale
spec:
  proxyClass: metrics-enabled
  hostname: private-gateway
  subnetRouter:
    advertiseRoutes:
      # Must match the private-istio gateway ClusterIP and the *.mmonteiro.dev
      # wildcard DNS record in Cloudflare.
      - "10.43.117.2/32"
  tags:
    - "tag:k8s"
