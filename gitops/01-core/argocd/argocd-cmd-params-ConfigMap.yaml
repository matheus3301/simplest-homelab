apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  server.insecure: "true"
  # Homelab memory tuning: fewer concurrent processors/parallelism than the
  # defaults (20/10/20) cuts application-controller + repo-server memory.
  controller.status.processors: "4"
  controller.operation.processors: "2"
  controller.kubectl.parallelism.limit: "4"
  reposerver.parallelism.limit: "2"
